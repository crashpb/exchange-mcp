name: exchange-mcp
services:
  mcp:
    build:
      context: .
    image: exchange-mcp:1.16.8
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./appsettings.Local.json:/app/appsettings.Local.json:ro
      - ./secrets/keycloak_introspection:/run/secrets/keycloak_introspection:ro
      - ./secrets/exchange_password:/run/secrets/exchange_password:ro
      - ./state:/app/audit
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_EnableDiagnostics: "0"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://127.0.0.1:8080/health/live]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
